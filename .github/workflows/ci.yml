name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install package and development tools
        run: |
          python -m pip install --requirement requirements-build.lock
          python -m pip install --requirement requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps --editable .

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Scan repository for high-confidence secrets
        run: python scripts/secret_scan.py

      - name: Type check
        run: mypy src/dxl_agent

      - name: Run tests
        run: python -m pytest

      - name: Run deterministic offline evaluations
        run: python -m dxl_agent.eval_runner --json

      - name: Build Python wheel
        run: python -m pip wheel . --no-build-isolation --no-deps --wheel-dir dist

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build container image
        run: docker build --tag dxl-commerce-agent:ci .
