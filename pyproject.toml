[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "dxl-commerce-agent"
version = "0.1.0"
description = "A production-minded, fully synthetic commerce support agent reference implementation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Wei Zhang" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "mypy>=1.11,<2.0",
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
dxl-commerce-agent = "dxl_agent.__main__:main"
dxl-agent-eval = "dxl_agent.eval_runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dxl_agent"]

[tool.hatch.build.targets.wheel.force-include]
"demo" = "demo"
"evals" = "evals"
"policies" = "policies"

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["dxl_agent"]
