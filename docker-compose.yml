services:
  decision:
    build: .
    ports:
      - "127.0.0.1:18080:18080"
    environment:
      # The image does not bundle a model account or OpenClaw gateway. Host deployment
      # uses agent mode; this isolated compose profile exercises the policy fallback.
      CLAWBOT_DECISION_MODE: policy
      CLAWBOT_API_KEY: ${CLAWBOT_API_KEY:-local-decision-example-key}
      CLAWBOT_TOOL_API_KEY: ${CLAWBOT_TOOL_API_KEY:-local-tool-example-key}
      CLAWBOT_IDENTITY_BASE_URL: http://identity:18082
      CLAWBOT_IDENTITY_ORG_ID: org_example
      CLAWBOT_IDENTITY_API_KEY: ${IDENTITY_API_KEY:-local-identity-example-key}
      CLAWBOT_ADB_CAPTURE_ENABLED: "0"
      CLAWBOT_WECOM_ENABLED: "0"
    volumes:
      - decision-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  identity:
    build: .
    command: ["dxl-identity-service"]
    environment:
      IDENTITY_HOST: 0.0.0.0
      IDENTITY_PORT: "18082"
      IDENTITY_DB_PATH: /app/data/identity.db
      IDENTITY_API_KEY: ${IDENTITY_API_KEY:-local-identity-example-key}
    volumes:
      - identity-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  decision-data:
  identity-data:
